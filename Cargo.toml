[package]
name = "signal-node"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "AGPL-3.0-only"
description = "Self-hosted Signal service for Polymorfa zero-knowledge sessions"
repository = "https://github.com/polymorfa/signal-node"
publish = false

[lib]
name = "signal_node"
path = "src/lib.rs"

[[bin]]
name = "signal-node"
path = "src/main.rs"

[dependencies]
# Signal core from oxidezap/whatsapp-rust, plus this service's own Signal
# operations and sealed record store, which build on its public API.
wacore = { workspace = true }
wacore-binary = { workspace = true }
wacore-recordstore = { path = "crates/recordstore" }
wacore-signal-ops = { path = "crates/signal-ops" }
waproto = { workspace = true }

aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
hmac = "0.12"
prost = "0.14"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "migrate", "macros"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wacore = { workspace = true, features = ["test-util"] }
rand10 = { package = "rand", version = "0.10" }
wacore-recordstore = { path = "crates/recordstore", features = ["conformance"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

[workspace]
resolver = "3"
members = [".", "crates/recordstore", "crates/signal-ops"]

[workspace.package]
rust-version = "1.95"

[workspace.dependencies]
wacore = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "2671430db6161c01c507587d0e3c90dcf153aa85" }
wacore-binary = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "2671430db6161c01c507587d0e3c90dcf153aa85" }
waproto = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "2671430db6161c01c507587d0e3c90dcf153aa85" }
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc"] }
anyhow = { version = "1.0", default-features = false }
async-lock = { version = "3", default-features = false }
async-trait = "0.1.91"
buffa = { version = "0.9.2", default-features = false, features = ["json"] }
bytes = { version = "1.12", default-features = false }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hmac = { version = "0.13.0", default-features = false }
rand = "0.10"
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false }
log = "0.4"
serde = { version = "1.0", features = ["derive", "rc"] }
